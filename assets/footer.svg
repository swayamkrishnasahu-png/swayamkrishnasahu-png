<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">Decorative footer banner</title>
  <desc id="footerDesc">Purple, blue and dark navy gradient footer with wave shapes and subtle glow accents.</desc>
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <radialGradient id="footerGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="footerGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <pattern id="footerGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="120" fill="url(#footerBg)" />
  <rect width="1200" height="120" fill="url(#footerGrid)" />
  <circle cx="120" cy="120" r="180" fill="url(#footerGlowCyan)" />
  <circle cx="1080" cy="0" r="200" fill="url(#footerGlowPurple)" />
  <path d="M0 46 C 180 12, 360 74, 540 42 S 900 12, 1200 48 L1200 120 L0 120 Z" fill="#0D1117" fill-opacity="0.45" />
  <path d="M0 76 C 220 42, 440 104, 660 72 S 1000 42, 1200 78 L1200 120 L0 120 Z" fill="#0D1117" fill-opacity="0.75" />
</svg>
