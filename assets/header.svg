<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="headerTitle headerDesc">
  <title id="headerTitle">Swayam Krishna Sahu — B.Tech CSE (AI &amp; ML), ITER, SOA University</title>
  <desc id="headerDesc">Dark navy, blue and purple gradient header banner with a subtle grid, glow accents and wave shapes.</desc>
  <defs>
    <linearGradient id="headerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <radialGradient id="headerGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="headerGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <pattern id="headerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="200" fill="url(#headerBg)" />
