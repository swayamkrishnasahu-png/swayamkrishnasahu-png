  <circle cx="140" cy="30" r="190" fill="url(#headerGlowCyan)" />
  <circle cx="1060" cy="180" r="230" fill="url(#headerGlowPurple)" />
  <path d="M0 164 C 200 126, 400 202, 600 164 S 1000 126, 1200 164 L1200 200 L0 200 Z" fill="#0D1117" fill-opacity="0.55" />
